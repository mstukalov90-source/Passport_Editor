# GitLab CI / MosHub (hub.mos.ru). only/except — совместим со старыми версиями GitLab.
# Переменные CI/CD: POSTGIS_IMAGE, PYTHON_IMAGE — см. GITLAB_CI.md

stages:
  - lint
  - test
  - e2e

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHON_IMAGE: "python:3.12-bookworm"
  POSTGIS_IMAGE: "postgis/postgis:16-3.4"
  POSTGIS_DB_HOST: postgis
  POSTGIS_DB_PORT: "5432"
  POSTGIS_DB_NAME: geodb
  POSTGIS_DB_USER: postgres
  POSTGIS_DB_PASSWORD: postgres
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: geodb

default:
  image: $PYTHON_IMAGE
  cache:
    paths:
      - .cache/pip

.install_gdal_and_python: &install_gdal_and_python
  - apt-get update -qq
  - apt-get install -y -qq --no-install-recommends gdal-bin libgdal-dev
  - bash scripts/ci_install_deps.sh
  - source scripts/ci_resolve_gdal_paths.sh

lint:
  stage: lint
  only:
    - main
    - deploy/vps-docker
    - deploy/mggt-docker
    - merge_requests
  script:
    - pip install 'ruff>=0.8'
    - ruff check pass_map pass_viewer

test:
  stage: test
  only:
    - main
    - deploy/vps-docker
    - deploy/mggt-docker
    - merge_requests
  services:
    - name: $POSTGIS_IMAGE
      alias: postgis
  before_script: *install_gdal_and_python
  script:
    - pytest -m "not e2e" -v

e2e:
  stage: e2e
  only:
    - main
    - deploy/vps-docker
    - deploy/mggt-docker
    - merge_requests
  variables:
    DJANGO_ALLOW_ASYNC_UNSAFE: "true"
  services:
    - name: $POSTGIS_IMAGE
      alias: postgis
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends gdal-bin libgdal-dev
    - bash scripts/ci_install_deps.sh
    - source scripts/ci_resolve_gdal_paths.sh
    - apt-get install -y -qq --no-install-recommends
        libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2
        libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1
        libpango-1.0-0 libcairo2 libasound2
    - playwright install chromium
  script:
    - pytest -m e2e --browser chromium -v
