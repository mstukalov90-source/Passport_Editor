<section class="approval-layer-panel is-collapsed" id="recheck-layer-panel" aria-label="Панель управления слоями">
    <div class="approval-layer-panel__header">
        <h2 class="approval-layer-panel__title">Управление слоями</h2>
        <button type="button" class="approval-layer-panel__toggle" id="recheck-layer-panel-toggle" aria-expanded="false" aria-controls="recheck-layer-panel-body" title="Развернуть панель слоёв">
            <span class="approval-layer-panel__toggle-icon" aria-hidden="true"></span>
        </button>
    </div>
    <div class="approval-layer-panel__body" id="recheck-layer-panel-body">
        {% if not layer_groups %}<p class="approval-layer-panel__empty">Нет слоёв для отображения.</p>{% endif %}
        {% for group in layer_groups %}
        <div class="approval-layer-group">
            <label class="approval-layer-group__title">
                <input type="checkbox" data-recheck-layer-group="{{ group.key }}" checked />
                <span>{{ group.title }}</span>
            </label>
            {% for layer in group.layers %}
            <label class="approval-layer-row">
                <input type="checkbox" data-recheck-layer-key="{% if group.key == 'work' %}work:{{ layer.key }}{% else %}{{ layer.key }}{% endif %}" data-recheck-layer-parent="{{ group.key }}" {% if layer.checked %}checked{% endif %} />
                <span class="approval-layer-row__name" title="{{ layer.key }}">{{ layer.name }}</span>
                <span class="approval-layer-row__count">({{ layer.count }})</span>
            </label>
            {% endfor %}
        </div>
        {% endfor %}
    </div>
</section>
