<div class="approval-events" aria-label="События согласования">
    <section class="approval-events__section approval-events__section--secondary is-collapsed">
        <div class="approval-events__section-header">
            <div class="approval-events__section-heading">
                <h3 class="approval-events__section-title">Процесс согласования границ</h3>
                <p class="approval-events__section-summary" id="approval-events-progress">Согласовано: 0 / 0</p>
            </div>
            <button
                type="button"
                class="approval-events__section-toggle"
                id="approval-events-list-toggle"
                aria-expanded="false"
                aria-controls="approval-secondary-chats"
                title="Развернуть процесс согласования границ"
            >
                <span class="approval-events__section-toggle-icon" aria-hidden="true"></span>
            </button>
        </div>
        <div class="approval-events__chat-area approval-events__chat-area--list" id="approval-secondary-chats">
            <div id="approval-primary-event-card" class="approval-events__primary-event-slot" hidden></div>
            <ul class="approval-event-list" id="approval-secondary-event-list"></ul>
            <p class="approval-events__empty" id="approval-secondary-empty" hidden>Дополнительных событий пока нет.</p>
        </div>
    </section>

    <section class="approval-events__section approval-events__section--primary">
        <div class="approval-events__event-meta">
            <h3 class="approval-events__section-title">Чат события</h3>
            <div class="approval-events__event-meta-actions">
                <button
                    type="button"
                    class="approval-events__info-btn"
                    id="approval-active-info-btn"
                    aria-label="Информация о чате"
                    title="Открыть информацию о чате"
                >
                    i
                </button>
                <span class="approval-events__status approval-events__status--active" id="approval-active-status"></span>
            </div>
        </div>
        <p class="approval-events__event-name" id="approval-active-title"></p>
        <div class="approval-events__closed-banner" id="approval-closed-banner" hidden>Событие согласовано.</div>
        <div class="approval-events__chat-area" id="approval-primary-chat">
            <div class="approval-chat-thread" id="approval-chat-thread"></div>
        </div>
        <form class="approval-chat-composer" id="approval-chat-form" onsubmit="return false;">
            <input
                type="file"
                id="approval-chat-files"
                class="approval-chat-composer__files"
                multiple
                accept=".jpg,.jpeg,.png,.pdf,.doc,.docx,image/jpeg,image/png,application/pdf"
                hidden
            />
            <span class="approval-chat-composer__file-names" id="approval-chat-file-names"></span>
            <div class="approval-chat-composer__reply-banner" id="approval-chat-reply-banner" hidden></div>
            <span class="approval-chat-composer__geometry-hint" id="approval-chat-geometry-hint" hidden></span>
            <textarea
                id="approval-chat-input"
                class="approval-chat-composer__input"
                rows="2"
                placeholder="Введите сообщение..."
                aria-label="Текст сообщения"
            ></textarea>
            <div class="approval-chat-composer__actions">
                <button type="button" class="approval-chat-composer__attach" id="approval-chat-attach-btn" title="Прикрепить файл">
                    <svg class="approval-chat-composer__attach-icon" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path fill="currentColor" d="M16.5 6v11.5a4 4 0 0 1-8 0V5a2.5 2.5 0 0 1 5 0v10.5a1.5 1.5 0 0 1-3 0V6h1.5v9.5a.5.5 0 0 0 1 0V5a4 4 0 0 0-8 0v12.5a5.5 5.5 0 0 0 11 0V6h1.5z"/>
                    </svg>
                    Прикрепить файл
                </button>
                <button type="button" class="approval-chat-composer__geometry" id="approval-chat-geometry-btn" title="Добавить геометрию к сообщению">
                    Добавить геометрию к сообщению
                </button>
                <button type="button" class="approval-chat-composer__send" id="approval-chat-send-btn">Отправить</button>
            </div>
        </form>
        <button type="button" class="approval-chat-composer__approve" id="approval-chat-approve-btn">Согласовать</button>
    </section>
</div>

<dialog id="approval-chat-confirm-dialog" class="approval-event-dialog" aria-labelledby="approval-chat-confirm-title">
    <form method="dialog" class="approval-event-dialog__form" id="approval-chat-confirm-form">
        <h3 class="approval-event-dialog__title" id="approval-chat-confirm-title">Подтверждение</h3>
        <p class="approval-chat-confirm-dialog__text" id="approval-chat-confirm-text"></p>
        <div class="approval-event-dialog__actions">
            <button type="submit" value="cancel" class="approval-event-dialog__cancel">Отменить</button>
            <button type="submit" value="confirm" class="approval-event-dialog__submit" id="approval-chat-confirm-submit">Подтвердить</button>
        </div>
    </form>
</dialog>

<dialog id="approval-active-info-dialog" class="approval-event-dialog approval-active-info-dialog" aria-labelledby="approval-active-info-title">
    <div class="approval-event-dialog__form approval-active-info-dialog__content">
        <div class="approval-active-info-dialog__header">
            <h3 class="approval-event-dialog__title" id="approval-active-info-title">Информация о чате</h3>
            <button
                type="button"
                class="approval-active-info-dialog__close"
                id="approval-active-info-close"
                aria-label="Закрыть информацию о чате"
                title="Закрыть"
            >
                &times;
            </button>
        </div>
        <p class="approval-events__event-subtitle" id="approval-active-subtitle" hidden></p>
        <div class="approval-events__participants" id="approval-active-participants" hidden></div>
        <div class="approval-events__approval-progress" id="approval-approval-progress" hidden></div>
        <div class="approval-events__message-stats" id="approval-message-stats" hidden>
            <div class="approval-events__message-stats-header">
                <span class="approval-events__message-stats-title">Статистика сообщений</span>
                <button
                    type="button"
                    class="approval-events__message-stats-toggle"
                    id="approval-message-stats-toggle"
                    aria-expanded="true"
                    aria-controls="approval-message-stats-list"
                    title="Свернуть статистику сообщений"
                >
                    <span class="approval-events__message-stats-toggle-icon" aria-hidden="true"></span>
                </button>
            </div>
            <ul class="approval-events__message-stats-list" id="approval-message-stats-list"></ul>
        </div>
    </div>
</dialog>

<dialog id="approval-chat-image-lightbox" class="approval-chat-lightbox" aria-label="Просмотр изображения">
    <button type="button" class="approval-chat-lightbox__close" id="approval-chat-lightbox-close" aria-label="Закрыть">
        &times;
    </button>
    <img class="approval-chat-lightbox__img" id="approval-chat-lightbox-img" alt="" />
</dialog>

<dialog id="approval-change-owner-dialog" class="approval-event-dialog" aria-labelledby="approval-change-owner-title">
    <form method="dialog" class="approval-event-dialog__form" id="approval-change-owner-form">
        <h3 class="approval-event-dialog__title" id="approval-change-owner-title">Сменить владельца</h3>
        <label class="approval-event-dialog__label" for="approval-change-owner-case">Событие</label>
        <select id="approval-change-owner-case" class="approval-event-dialog__input" required></select>
        <label class="approval-event-dialog__label" for="approval-change-owner-old">Текущий владелец</label>
        <select id="approval-change-owner-old" class="approval-event-dialog__input" required></select>
        <label class="approval-event-dialog__label" for="approval-change-owner-new">Новый OwnerLegalPersonId</label>
        <input
            type="text"
            id="approval-change-owner-new"
            class="approval-event-dialog__input"
            autocomplete="off"
            required
        />
        <p class="approval-event-dialog__error" id="approval-change-owner-error" hidden></p>
        <div class="approval-event-dialog__actions">
            <button type="submit" value="cancel" class="approval-event-dialog__cancel" formnovalidate>Отменить</button>
            <button type="submit" value="confirm" class="approval-event-dialog__submit" id="approval-change-owner-submit">
                Сохранить
            </button>
        </div>
    </form>
</dialog>

<dialog id="approval-add-participant-dialog" class="approval-event-dialog" aria-labelledby="approval-add-participant-title">
    <form method="dialog" class="approval-event-dialog__form" id="approval-add-participant-form">
        <h3 class="approval-event-dialog__title" id="approval-add-participant-title">Добавить участника</h3>
        <label class="approval-event-dialog__label" for="approval-add-participant-kind">Тип</label>
        <select id="approval-add-participant-kind" class="approval-event-dialog__input">
            <option value="owner">По owner (OwnerLegalPersonId)</option>
            <option value="login">По login</option>
        </select>
        <label class="approval-event-dialog__label" for="approval-add-participant-value" id="approval-add-participant-value-label">
            OwnerLegalPersonId
        </label>
        <input
            type="text"
            id="approval-add-participant-value"
            class="approval-event-dialog__input"
            autocomplete="off"
            required
        />
        <p class="approval-event-dialog__error" id="approval-add-participant-error" hidden></p>
        <div class="approval-event-dialog__actions">
            <button type="submit" value="cancel" class="approval-event-dialog__cancel" formnovalidate>Отменить</button>
            <button type="submit" value="confirm" class="approval-event-dialog__submit" id="approval-add-participant-submit">
                Добавить
            </button>
        </div>
    </form>
</dialog>
