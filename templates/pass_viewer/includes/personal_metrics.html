<section class="personal-metrics" aria-label="Метрики">
    <div class="personal-metric-card">
        <div class="personal-metric-card__value">{{ personal_metrics.passport_count }}</div>
        <div class="personal-metric-card__label">Количество утверждённых паспортов</div>
    </div>
    <div class="personal-metric-card">
        <div class="personal-metric-card__value personal-metric-card__value--areas">{{ personal_metrics.total_area_label }}</div>
        <div class="personal-metric-card__label">Уборочная площадь / Общая площадь</div>
    </div>
    <div class="personal-metric-card">
        <div class="personal-metric-card__value">{{ personal_metrics.request_count }}</div>
        <div class="personal-metric-card__label">Подано заявок</div>
    </div>
    <div class="personal-metric-card">
        <div class="personal-metric-card__value">{{ personal_metrics.approval_count }}</div>
        <div class="personal-metric-card__label">Согласование границ ОГХ</div>
    </div>
</section>
