# See https://pre-commit.com for usage.
# Install: pip install pre-commit && pre-commit install
# Run all hooks: pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        name: ruff check (pass_map, pass_viewer)
        args: [--fix]
        files: ^(pass_map|pass_viewer)/.*\.py$
  - repo: local
    hooks:
      - id: page-js-check
        name: page JS _extracted sync check
        entry: python3 pass_viewer/static/build_page_js.py --check
        language: system
        pass_filenames: false
        files: ^pass_viewer/static/pass_viewer/js/
