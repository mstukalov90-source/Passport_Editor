<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="icon" type="image/png" href="assets/pass_viewer/brand-mark.png">
    <link rel="stylesheet" href="assets/pass_viewer/css/base.css">
    <link rel="stylesheet" href="assets/pass_viewer/css/tokens.css">
    <link rel="stylesheet" href="assets/pass_viewer/css/header.css">
    <link rel="stylesheet" href="assets/pass_viewer/css/login.css">
    <script src="assets/pass_viewer/js/header.js" defer></script>
</head>
<body class="login-page">

<main class="container">
    <div class="login-card">
        <div class="login-brand-title">САПР МГГТ 2.0</div>
        <h1 class="login-title">Вход в систему</h1>

        <form class="login-form" method="post">
            <input type="hidden" name="csrfmiddlewaretoken" value="static-preview">

            <p>
                <label for="id_username">Имя пользователя:</label>
                <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="id_username">
            </p>

            <p>
                <label for="id_password">Пароль:</label>
                <input type="password" name="password" autocomplete="current-password" required id="id_password">
            </p>

            <a class="login-submit" href="personal_account.html">Войти</a>
        </form>

        <div class="login-actions">
            <a class="login-action-btn" href="#">Регистрация пользователя</a>
            <a class="login-action-btn login-action-btn--secondary" href="#">Ссылка на TDM канал</a>
        </div>
    </div>
</main>

</body>
</html>
