<!doctype html>
<html lang="ru"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Границы объектов ОГХ</title>
    
    <link rel="icon" type="image/png" href="../assets/pass_viewer/brand-mark.png">
    <link rel="stylesheet" href="../assets/pass_viewer/css/base.css">

<link rel="stylesheet" href="../assets/pass_viewer/css/tokens.css">
<link rel="stylesheet" href="../assets/pass_viewer/css/map-core.css">
<link rel="stylesheet" href="../assets/pass_viewer/css/map-toolbar.css">
<link rel="stylesheet" href="../assets/pass_viewer/css/home.css">



<style>
    body.modal-preview-page { margin: 0; min-width: 320px; background: #eef2f7; }
    .modal-preview-header { padding: 16px 24px; background: #fff; border-bottom: 1px solid #d8e0ea; font: 14px/1.4 'Montserrat', 'Century Gothic', Arial, sans-serif; color: #334155; }
    .modal-preview-header h1 { margin: 0 0 4px; color: #0f172a; font-size: 20px; }
    .modal-preview-screen { box-sizing: border-box; display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 78px); padding: 24px; }
    .modal-preview-screen > .modal-overlay, .modal-preview-screen > [role="dialog"], .modal-preview-screen > [id$="-modal"] { position: relative !important; inset: auto !important; display: flex !important; visibility: visible !important; opacity: 1 !important; width: 100%; min-height: min(680px, calc(100vh - 126px)); }
    .modal-preview-screen > dialog { position: relative !important; inset: auto !important; display: block !important; visibility: visible !important; opacity: 1 !important; margin: auto; }
    .modal-preview-screen iframe { background: #f8fafc; }
</style>
</head>
<body class="modal-preview-page"><header class="modal-preview-header"><h1>Уведомления</h1><span>Статический макет · home</span></header>
<main class="modal-preview-screen"><div
        id="approval-notifications-modal"
        class="approval-notifications-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="approval-notifications-modal-title"
    >
        <div class="approval-notifications-modal__card">
            <div class="approval-notifications-modal__header">
                <h3 id="approval-notifications-modal-title">Уведомления</h3>
                <div class="approval-notifications-modal__header-actions">
                    <label
                        class="approval-title-mode-switch"
                        for="approval-notifications-title-mode"
                        title="Отображение заголовков событий: номера или имена объектов"
                    >
                        <input type="checkbox" id="approval-notifications-title-mode" />
                        <span class="approval-title-mode-switch__label approval-title-mode-switch__label--left">Номера</span>
                        <span class="approval-title-mode-switch__track" aria-hidden="true"></span>
                        <span class="approval-title-mode-switch__label approval-title-mode-switch__label--right">Имена</span>
                    </label>
                    <button type="button" id="approval-notifications-close-btn" class="approval-notifications-modal__close" aria-label="Закрыть">&#10005;</button>
                </div>
            </div>
            <div class="approval-notifications-modal__body">
                <section
                    id="approval-notifications-approvals-section"
                    class="approval-notifications-section"
                    aria-labelledby="approval-notifications-approvals-title"
                >
                    <h4 id="approval-notifications-approvals-title" class="approval-notifications-panel__header">Согласования</h4>
                    <ul id="approval-notifications-feed" class="approval-notifications-list"></ul>
                </section>

                <section
                    id="approval-ods-sync-section"
                    class="approval-notifications-section approval-ods-sync-section"
                    aria-labelledby="approval-notifications-ods-title"
                >
                    <h4 id="approval-notifications-ods-title" class="approval-notifications-panel__header">АСУ ОДС</h4>
                    <ul id="approval-ods-sync-list" class="approval-notifications-list"></ul>
                </section>

                <p id="approval-notifications-empty" class="approval-notifications-empty">Нет новых уведомлений</p>
            </div>
        </div>
    </div></main></body></html>
