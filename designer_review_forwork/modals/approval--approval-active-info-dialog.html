<!doctype html>
<html lang="ru"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Согласование границ ОГХ</title>
    
    <link rel="icon" type="image/png" href="../assets/pass_viewer/brand-mark.png">
    <link rel="stylesheet" href="../assets/pass_viewer/css/base.css">
    

<link rel="stylesheet" href="../assets/pass_viewer/css/tokens.css">
<link rel="stylesheet" href="../assets/pass_viewer/css/map-core.css">
<link rel="stylesheet" href="../assets/pass_viewer/css/map-editor.css">
<link rel="stylesheet" href="../assets/approval/css/landing.css">


<style>
    body.modal-preview-page { margin: 0; min-width: 320px; background: #eef2f7; }
    .modal-preview-header { padding: 16px 24px; background: #fff; border-bottom: 1px solid #d8e0ea; font: 14px/1.4 'Montserrat', 'Century Gothic', Arial, sans-serif; color: #334155; }
    .modal-preview-header h1 { margin: 0 0 4px; color: #0f172a; font-size: 20px; }
    .modal-preview-screen { box-sizing: border-box; display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 78px); padding: 24px; }
    .modal-preview-screen > .modal-overlay, .modal-preview-screen > [role="dialog"], .modal-preview-screen > [id$="-modal"] { position: relative !important; inset: auto !important; display: flex !important; visibility: visible !important; opacity: 1 !important; width: 100%; min-height: min(680px, calc(100vh - 126px)); }
    .modal-preview-screen > dialog { position: relative !important; inset: auto !important; display: block !important; visibility: visible !important; opacity: 1 !important; margin: auto; }
    .modal-preview-screen iframe { background: #f8fafc; }
</style>
</head>
<body class="modal-preview-page"><header class="modal-preview-header"><h1>Информация о чате</h1><span>Статический макет · approval</span></header>
<main class="modal-preview-screen"><dialog id="approval-active-info-dialog" class="approval-event-dialog approval-active-info-dialog" aria-labelledby="approval-active-info-title">
    <div class="approval-event-dialog__form approval-active-info-dialog__content">
        <div class="approval-active-info-dialog__header">
            <h3 class="approval-event-dialog__title" id="approval-active-info-title">Информация о чате</h3>
            <button
                type="button"
                class="approval-active-info-dialog__close"
                id="approval-active-info-close"
                aria-label="Закрыть информацию о чате"
                title="Закрыть"
            >
                &times;
            </button>
        </div>
        <p class="approval-events__event-subtitle" id="approval-active-subtitle">Событие № 240817-003 · В работе</p>
        <div class="approval-events__participants" id="approval-active-participants">Участники: Департамент городского хозяйства, балансодержатель, МГГТ</div>
        <div class="approval-events__approval-progress" id="approval-approval-progress">Согласовано: 2 из 3</div>
        <div class="approval-events__message-stats" id="approval-message-stats">
            <div class="approval-events__message-stats-header">
                <span class="approval-events__message-stats-title">Статистика сообщений</span>
                <button
                    type="button"
                    class="approval-events__message-stats-toggle"
                    id="approval-message-stats-toggle"
                    aria-expanded="true"
                    aria-controls="approval-message-stats-list"
                    title="Свернуть статистику сообщений"
                >
                    <span class="approval-events__message-stats-toggle-icon" aria-hidden="true"></span>
                </button>
            </div>
            <ul class="approval-events__message-stats-list" id="approval-message-stats-list"><li>Департамент — 4 сообщения</li><li>Балансодержатель — 2 сообщения</li></ul>
        </div>
    </div>
</dialog></main></body></html>
