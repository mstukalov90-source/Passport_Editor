<!doctype html>
<html lang="ru"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Границы объектов ОГХ</title>
    
    <link rel="icon" type="image/png" href="../assets/pass_viewer/brand-mark.png">
    <link rel="stylesheet" href="../assets/pass_viewer/css/base.css">

<link rel="stylesheet" href="../assets/pass_viewer/css/tokens.css">
<link rel="stylesheet" href="../assets/pass_viewer/css/map-core.css">
<link rel="stylesheet" href="../assets/pass_viewer/css/map-toolbar.css">
<link rel="stylesheet" href="../assets/pass_viewer/css/home.css">



<style>
    body.modal-preview-page { margin: 0; min-width: 320px; background: #eef2f7; }
    .modal-preview-header { padding: 16px 24px; background: #fff; border-bottom: 1px solid #d8e0ea; font: 14px/1.4 'Montserrat', 'Century Gothic', Arial, sans-serif; color: #334155; }
    .modal-preview-header h1 { margin: 0 0 4px; color: #0f172a; font-size: 20px; }
    .modal-preview-screen { box-sizing: border-box; display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 78px); padding: 24px; }
    .modal-preview-screen > .modal-overlay, .modal-preview-screen > [role="dialog"], .modal-preview-screen > [id$="-modal"] { position: relative !important; inset: auto !important; display: flex !important; visibility: visible !important; opacity: 1 !important; width: 100%; min-height: min(680px, calc(100vh - 126px)); }
    .modal-preview-screen > dialog { position: relative !important; inset: auto !important; display: block !important; visibility: visible !important; opacity: 1 !important; margin: auto; }
    .modal-preview-screen iframe { background: #f8fafc; }
</style>
</head>
<body class="modal-preview-page"><header class="modal-preview-header"><h1>Досъёмы по заявке</h1><span>Статический макет · home</span></header>
<main class="modal-preview-screen"><div
        id="owned-recaps-modal"
        style="display: flex; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); z-index: 1002; align-items: center; justify-content: center; padding: 16px;"
    >
        <div style="background: #fff; border-radius: 10px; border: 1px solid #e3e6ec; width: 100%; max-width: 520px; padding: 18px; max-height: min(80vh, 640px); display: flex; flex-direction: column;">
            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-shrink: 0;">
                <h3 id="owned-recaps-modal-title" style="margin: 0; font-size: 18px;">Досъёмы по заявке</h3>
                <button type="button" id="owned-recaps-close-btn" style="background: #e5e7eb; color: #111;">&#10005;</button>
            </div>
            <p id="owned-recaps-modal-subtitle" class="note" style="margin: 0 0 12px; flex-shrink: 0;">Заявка № 240817-003 · Благоустройство дворовой территории</p>
            <p id="owned-recaps-status" class="note" style="margin: 0 0 12px; flex-shrink: 0;">Найдено досъёмов: 2</p>
            <div id="owned-recaps-list" style="overflow: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px;"><div class="owned-list-item"><strong>Досъём № 240817-005</strong><br><span class="note">В работе</span></div><div class="owned-list-item"><strong>Досъём № 240817-006</strong><br><span class="note">Согласовано</span></div></div>
            <div style="display: flex; justify-content: flex-end; margin-top: 14px; flex-shrink: 0;">
                <button type="button" id="owned-recaps-done-btn" style="background: #e5e7eb; color: #111;">Закрыть</button>
            </div>
        </div>
    </div></main></body></html>
