<style>
    body.modal-preview-page { margin: 0; min-width: 320px; background: #eef2f7; }
    .modal-preview-header { padding: 16px 24px; background: #fff; border-bottom: 1px solid #d8e0ea; font: 14px/1.4 'Montserrat', 'Century Gothic', Arial, sans-serif; color: #334155; }
    .modal-preview-header h1 { margin: 0 0 4px; color: #0f172a; font-size: 20px; }
    .modal-preview-screen { box-sizing: border-box; display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 78px); padding: 24px; }
    .modal-preview-screen > .modal-overlay, .modal-preview-screen > [role="dialog"], .modal-preview-screen > [id$="-modal"] { position: relative !important; inset: auto !important; display: flex !important; visibility: visible !important; opacity: 1 !important; width: 100%; min-height: min(680px, calc(100vh - 126px)); }
    .modal-preview-screen > dialog { position: relative !important; inset: auto !important; display: block !important; visibility: visible !important; opacity: 1 !important; margin: auto; }
    .modal-preview-screen iframe { background: #f8fafc; }
</style>

<body class="modal-preview-page"><header class="modal-preview-header"><h1>Новый объект</h1><span>Статический макет · add_object</span></header>
<main class="modal-preview-screen"><div id="save-modal" class="modal-overlay" style="display:flex;">
        <div class="modal-card">
            <h3 style="margin: 0 0 10px;">&#1053;&#1086;&#1074;&#1099;&#1081; &#1086;&#1073;&#1098;&#1077;&#1082;&#1090;</h3>
            <p id="save-modal-dgi-warning" class="note" style="display:flex; margin: 8px 0 0; color: #b42318;"></p>
            <label class="modal-label" for="new-object-name">Название (необязательно)</label>
            <input id="new-object-name" class="modal-input" type="text" maxlength="255" / value="240817-005">
            <label class="modal-label" for="new-object-request-id">Номер заявки</label>
            <input id="new-object-request-id" class="modal-input" type="text" maxlength="100" inputmode="numeric" pattern="[0-9]*" / value="240817-005">
            <label class="modal-label" style="margin-top: 10px;">Таблица сохранения</label>
            <div style="display: flex; flex-wrap: wrap; gap: 16px; margin: 4px 0 2px;">
                <label class="modal-label" style="font-weight: normal; margin: 0;">
                    <input type="radio" name="save-target-table" id="save-target-dt" value="ДТ" checked />
                    ДТ
                </label>
                <label class="modal-label" style="font-weight: normal; margin: 0;">
                    <input type="radio" name="save-target-table" id="save-target-odh" value="ОДХ" />
                    ОДХ
                </label>
                <label class="modal-label" style="font-weight: normal; margin: 0;">
                    <input type="radio" name="save-target-table" id="save-target-ozn" value="ОЗН" />
                    ОО
                </label>
                <label class="modal-label" style="font-weight: normal; margin: 0;">
                    <input type="radio" name="save-target-table" id="save-target-top" value="ТОП" />
                    ТОП
                </label>
            </div>
            <p class="note" style="margin: 0 0 4px; font-size: 12px; color: #64748b;">
                Если в выбранной таблице уже есть строка с этим номером заявки для вашего владельца, она будет перезаписана.
            </p>
            <p id="save-modal-error" class="note" style="margin: 8px 0 0; color: #b42318;"></p>
            <p id="save-modal-success" class="note" style="margin: 8px 0 0; color: #15803d; display: flex;"></p>
            <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:14px; flex-wrap:wrap;">
                <button type="button" id="save-modal-fix-polygon" class="map-toolbar-btn" style="display:flex;">Исправить полигон</button>
                <div style="display:flex; justify-content:flex-end; gap:8px; margin-left:auto;">
                    <button type="button" id="save-modal-cancel" class="map-toolbar-btn map-toolbar-btn--muted">&#1054;&#1090;&#1084;&#1077;&#1085;&#1072;</button>
                    <button type="button" id="save-modal-submit" class="map-toolbar-btn map-toolbar-btn--success">&#1057;&#1086;&#1093;&#1088;&#1072;&#1085;&#1080;&#1090;&#1100;</button>
                </div>
            </div>
        </div>
    </div></main></body></html>
