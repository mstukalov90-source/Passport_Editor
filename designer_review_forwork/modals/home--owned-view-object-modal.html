<!doctype html>
<html lang="ru"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Границы объектов ОГХ</title>
    
    <link rel="icon" type="image/png" href="../assets/pass_viewer/brand-mark.png">
    <link rel="stylesheet" href="../assets/pass_viewer/css/base.css">

<link rel="stylesheet" href="../assets/pass_viewer/css/tokens.css">
<link rel="stylesheet" href="../assets/pass_viewer/css/map-core.css">
<link rel="stylesheet" href="../assets/pass_viewer/css/map-toolbar.css">
<link rel="stylesheet" href="../assets/pass_viewer/css/home.css">



<style>
    body.modal-preview-page { margin: 0; min-width: 320px; background: #eef2f7; }
    .modal-preview-header { padding: 16px 24px; background: #fff; border-bottom: 1px solid #d8e0ea; font: 14px/1.4 'Montserrat', 'Century Gothic', Arial, sans-serif; color: #334155; }
    .modal-preview-header h1 { margin: 0 0 4px; color: #0f172a; font-size: 20px; }
    .modal-preview-screen { box-sizing: border-box; display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 78px); padding: 24px; }
    .modal-preview-screen > .modal-overlay, .modal-preview-screen > [role="dialog"], .modal-preview-screen > [id$="-modal"] { position: relative !important; inset: auto !important; display: flex !important; visibility: visible !important; opacity: 1 !important; width: 100%; min-height: min(680px, calc(100vh - 126px)); }
    .modal-preview-screen > dialog { position: relative !important; inset: auto !important; display: block !important; visibility: visible !important; opacity: 1 !important; margin: auto; }
    .modal-preview-screen iframe { background: #f8fafc; }
</style>
</head>
<body class="modal-preview-page"><header class="modal-preview-header"><h1>Просмотр объекта</h1><span>Статический макет · home</span></header>
<main class="modal-preview-screen"><div
        id="owned-view-object-modal"
        class="owned-view-object-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="owned-view-object-modal-title"
        style="display: flex;"
    >
        <div class="owned-view-object-modal__card">
            <div class="owned-view-object-modal__header">
                <h3 id="owned-view-object-modal-title">Просмотр объекта</h3>
                <div class="owned-view-object-modal__header-actions">
                    <button type="button" id="owned-view-object-edit-btn" class="map-toolbar-btn map-toolbar-btn--primary owned-view-object-edit-btn" style="display:flex;">Редактировать объект</button>
                    <button type="button" id="owned-view-object-close-btn" class="owned-view-object-modal__close" aria-label="Закрыть">&#10005;</button>
                </div>
            </div>
            <p id="owned-view-object-status" class="note owned-view-object-modal__status">Демонстрационный режим просмотра объекта</p>
            <div class="owned-view-object-modal__body">
                <div id="owned-view-object-loading" class="owned-view-object-modal__loading">
                    <div class="owned-view-object-modal__spinner" aria-hidden="true"></div>
                    <span>Загрузка карты и слоёв…</span>
                </div>
                <iframe
                    id="owned-view-object-frame"
                    class="owned-view-object-modal__frame"
                    title="Просмотр объекта"
                    src="../assets/pass_viewer/brand-mark.png"
                ></iframe>
            </div>
        </div>
    </div></main></body></html>
