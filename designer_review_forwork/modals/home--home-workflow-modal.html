<!doctype html>
<html lang="ru"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Границы объектов ОГХ</title>
    
    <link rel="icon" type="image/png" href="../assets/pass_viewer/brand-mark.png">
    <link rel="stylesheet" href="../assets/pass_viewer/css/base.css">

<link rel="stylesheet" href="../assets/pass_viewer/css/tokens.css">
<link rel="stylesheet" href="../assets/pass_viewer/css/map-core.css">
<link rel="stylesheet" href="../assets/pass_viewer/css/map-toolbar.css">
<link rel="stylesheet" href="../assets/pass_viewer/css/home.css">



<style>
    body.modal-preview-page { margin: 0; min-width: 320px; background: #eef2f7; }
    .modal-preview-header { padding: 16px 24px; background: #fff; border-bottom: 1px solid #d8e0ea; font: 14px/1.4 'Montserrat', 'Century Gothic', Arial, sans-serif; color: #334155; }
    .modal-preview-header h1 { margin: 0 0 4px; color: #0f172a; font-size: 20px; }
    .modal-preview-screen { box-sizing: border-box; display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 78px); padding: 24px; }
    .modal-preview-screen > .modal-overlay, .modal-preview-screen > [role="dialog"], .modal-preview-screen > [id$="-modal"] { position: relative !important; inset: auto !important; display: flex !important; visibility: visible !important; opacity: 1 !important; width: 100%; min-height: min(680px, calc(100vh - 126px)); }
    .modal-preview-screen > dialog { position: relative !important; inset: auto !important; display: block !important; visibility: visible !important; opacity: 1 !important; margin: auto; }
    .modal-preview-screen iframe { background: #f8fafc; }
</style>
</head>
<body class="modal-preview-page"><header class="modal-preview-header"><h1>Выберите действие</h1><span>Статический макет · home</span></header>
<main class="modal-preview-screen"><div
        id="home-workflow-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="home-workflow-modal-title"
        style="display: flex; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); z-index: 999; align-items: center; justify-content: center; padding: 16px;"
    >
        <div style="background: #fff; border-radius: 10px; border: 1px solid #e3e6ec; width: 100%; max-width: 560px; padding: 18px;">
            <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px;">
                <h3 id="home-workflow-modal-title" style="margin: 0; font-size: 18px; line-height: 1.35;">
                    Выберите действие
                </h3>
                <button type="button" id="home-workflow-close-btn" style="flex-shrink: 0; background: #e5e7eb; color: #111;">&#10005;</button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button type="button" id="home-workflow-ods-requests-btn" class="home-workflow-action-btn">
                    Работа с заявками из АСУ ОДС
                </button>
                <button type="button" id="home-workflow-primary-btn" class="home-workflow-action-btn">
                    Подача заявки на первичную паспортизацию
                </button>
                <button type="button" id="home-workflow-boundaries-btn" class="home-workflow-action-btn">
                    Редактирование действующих границ ОГХ и заявок
                </button>
                <button type="button" id="home-workflow-split-passport-btn" class="home-workflow-action-btn">
                    Разделить актуальный паспорт ОГХ
                </button>
                <button type="button" id="home-workflow-merge-btn" class="home-workflow-action-btn">
                    Объединение объектов
                </button>
            </div>
        </div>
    </div></main></body></html>
